<div class="edit-climb-container">
    <mat-card class="edit-climb-card mat-elevation-z2">
        <mat-card-title>Edit Climb #{{ climb?.routeId }}</mat-card-title>

        <mat-card-content>
            <form *ngIf="climbFormGroup" [formGroup]="climbFormGroup" (ngSubmit)="updateClimb()">

                <!-- Gym Dropdown -->
                <mat-form-field appearance="outline">
                    <mat-label>Gym</mat-label>
                    <mat-select formControlName="gymId" [compareWith]="compareIds">
                        <mat-option *ngFor="let gym of gyms" [value]="gym.id">
                            {{ gym.name }}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="climbFormGroup.controls['gymId'].hasError('required')">
                        Gym selection is required
                    </mat-error>
                </mat-form-field>

                <!-- Grade Dropdown -->
                <mat-form-field appearance="outline">
                    <mat-label>Grade</mat-label>
                    <mat-select formControlName="gradeId" [compareWith]="compareIds">
                        <mat-option *ngFor="let g of grades" [value]="g.id">
                            {{ g.display }}
                        </mat-option>
                    </mat-select>
                    <div class="current-grade" *ngIf="climb?.grade">Current: {{ climb.grade }}</div>
                </mat-form-field>

                <!-- Set Date -->
                <mat-form-field appearance="outline">
                    <mat-label>Set Date</mat-label>
                    <input matInput type="date" formControlName="setDate">
                </mat-form-field>

                <!-- Remove Date -->
                <mat-form-field appearance="outline">
                    <mat-label>Remove Date</mat-label>
                    <input matInput type="date" formControlName="removeDate">
                    <mat-error *ngIf="climbFormGroup.get('removeDate')?.hasError('dateOrder')">
                        Remove date cannot be before set date
                    </mat-error>
                </mat-form-field>

                <!-- Admin ID (read-only / informational) -->
                <mat-form-field appearance="outline">
                    <mat-label>Admin ID</mat-label>
                    <input matInput type="number" formControlName="adminId" readonly>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="climbFormGroup.invalid || climbFormGroup.hasError('dateOrder')">
                    Update
                </button>

            </form>
        </mat-card-content>
    </mat-card>
</div>
